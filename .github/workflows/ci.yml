name: TTCGameLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          # Non-secret placeholders for compilation only; CI does not deploy or run the app.
          # Vercel continues to use its own real authentication configuration.
          NEON_AUTH_BASE_URL: https://example.test
          NEON_AUTH_COOKIE_SECRET: ci-build-only-not-production-secret-0000
